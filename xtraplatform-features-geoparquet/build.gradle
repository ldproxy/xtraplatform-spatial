maturity = 'PROPOSAL'
maintenance = 'NONE'
description = 'GeoParquet feature provider.'
descriptionDe = 'GeoParquet Feature-Provider.'

dependencies {
    provided 'de.interactive_instruments:xtraplatform-blobs'
    provided 'de.interactive_instruments:xtraplatform-cache'
    provided 'de.interactive_instruments:xtraplatform-entities'
    provided 'de.interactive_instruments:xtraplatform-streams'
    provided 'de.interactive_instruments:xtraplatform-values'
    provided 'de.interactive_instruments:xtraplatform-services'
    provided project(':xtraplatform-cql')
    provided project(':xtraplatform-crs')
    provided project(':xtraplatform-features')
    provided project(':xtraplatform-features-sql')
    provided project(':xtraplatform-geometries')

    embedded(libs.duckdb)
}

// DuckDB bundles a native library per platform. The published jar is used by every ldproxy
// distribution (Docker images for linux/amd64 and linux/arm64, development on macOS), so it keeps
// the natives of these platforms (xtraplatform-native has no Windows build); since duckdb is
// pretty big, a build for an explicitly given platform (-Pplatform=...) keeps only that one.
def duckdbNatives = [
    'linux-amd64': 'libduckdb_java.so_linux_amd64',
    'linux-arm64': 'libduckdb_java.so_linux_arm64',
    'osx-arm64'  : 'libduckdb_java.so_macos_arm64',
    'windows-amd64': 'libduckdb_java.so_windows_amd64',
]
def explicitPlatform = gradle.startParameter.projectProperties.containsKey('platform') ? project.platform : null

project.subprojects { Project subproject ->
    if (subproject.name.endsWith("-tpl")) {
        subproject.afterEvaluate {
            subproject.tasks.named("jar") {
                if (explicitPlatform == null) {
                    exclude duckdbNatives['windows-amd64']
                } else {
                    duckdbNatives.each { platform, nativeLib ->
                        if (platform != explicitPlatform) exclude nativeLib
                    }
                }
            }
        }
    }
}
